<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="assets/office.css?v=8"><script src="assets/config.js?v=8"></script><title>مدیریت دبیرخانه همتا صنعت</title></head><body><nav class="office-nav"><a href="index.html">خانه</a><a href="office.html">خدمات مکاتبات</a><a href="admin.html">پنل مدیر</a></nav><main class="office-wrap"><div class="office-hero"><h1>مدیریت دبیرخانه و خدمات اداری</h1><p>مدیریت تعرفه، اداره‌ها، اشتراک‌ها، ارجاع و وضعیت مکاتبات</p></div><div id="notice"></div><section class="office-card"><h2>تنظیمات هزینه</h2><label>هزینه تنظیم متن نامه (تومان)<input id="fee" type="number" min="0"></label><button onclick="saveSetting('writing_fee',document.getElementById('fee').value)">ذخیره هزینه</button><label>راهنمای پرداخت<textarea id="instructions"></textarea></label><button onclick="saveSetting('payment_instructions',document.getElementById('instructions').value)">ذخیره راهنما</button></section><section class="office-card"><h2>ادارات / خدمات / اشتراک‌ها</h2><p>برای ویرایش روی دکمه ویرایش هر ردیف بزنید؛ برای حذف از نمایش، گزینه فعال را بردارید.</p><select id="kind"><option value="agency">اداره</option><option value="service">خدمت</option><option value="plan">اشتراک</option></select><input id="rowId" type="hidden"><input id="name" placeholder="عنوان"><div id="agencyFields"><input id="username" placeholder="نام کاربری اداره"><input id="password" type="password" placeholder="رمز جدید (حداقل ۱۰ نویسه؛ برای عدم تغییر خالی بگذارید)"></div><div id="priceFields"><input id="price" type="number" min="0" placeholder="مبلغ تومان"></div><div id="planFields"><input id="months" type="number" min="0" placeholder="مدت ماه"><input id="limit" type="number" min="0" placeholder="سقف درخواست"></div><label><input id="active" type="checkbox" checked style="width:auto"> فعال</label><button onclick="saveCatalog()">ذخیره</button><button onclick="clearForm()">رکورد جدید</button><div id="catalog"></div></section><section class="office-card"><h2>درخواست‌ها و ارجاع به ادارات</h2><div id="requests"></div></section><section class="office-card"><h2>تأیید اشتراک‌ها</h2><div id="subscriptions"></div></section></main><script src="assets/office-admin.js?v=8"></script></body></html>
